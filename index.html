<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Flashcards</title><style>*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}body{font-family:-apple-system,"PingFang SC","Hiragino Sans GB",sans-serif;background:#f6f2ec;min-height:100vh;padding:20px}.screen{max-width:430px;margin:0 auto;display:none;flex-direction:column;align-items:center;gap:16px}.screen.on{display:flex}h1{font-size:20px;color:#3a3330;text-align:center}.sub{font-size:13px;color:#8a7f78;text-align:center;margin-top:-8px}input{font-family:inherit;font-size:18px;text-align:center;letter-spacing:2px;padding:13px;border:2px solid #ddd2c6;border-radius:14px;width:100%;outline:none;text-transform:uppercase}input:focus{border-color:#d94436}button{font-family:inherit;cursor:pointer;border:none;background:none}.big{width:100%;padding:14px;border-radius:14px;background:#d94436;color:#fff;font-size:16px;font-weight:600}.err{font-size:13px;color:#c0392b;min-height:18px;text-align:center}.deckBtn{width:100%;text-align:left;background:#fff;border:1.5px solid #eee5db;border-radius:14px;padding:14px 16px;display:flex;align-items:center;gap:12px}.deckBtn:active{background:#faf3ec}.deckBtn .dt{font-size:12.5px;color:#8a7f78;width:78px}.deckBtn .tp{flex:1;font-size:15px;font-weight:600;color:#3a3330}.deckBtn .n{font-size:12px;color:#8a7f78}.link{font-size:13px;color:#8a7f78;text-decoration:underline;padding:6px}.cnt{font-size:14px;color:#8a7f78;letter-spacing:2px}.scene{width:min(340px,90vw);aspect-ratio:3/4.15;perspective:1200px;cursor:pointer}.inner{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.2,.7,.3,1)}.inner.fl{transform:rotateY(180deg)}.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:safe center;gap:9px;padding:20px 18px;text-align:center;overflow-y:auto;-webkit-overflow-scrolling:touch}.face::-webkit-scrollbar{width:0}.front{box-shadow:8px 10px 0 var(--mc)}.back{transform:rotateY(180deg);color:#fff}.emoji{font-size:64px}.fimg{width:70%;border-radius:14px;max-height:42%;object-fit:cover}.hz{font-family:"Songti SC","STSong",serif;font-weight:700;font-size:clamp(30px,11vw,54px);line-height:1.2;color:#2b2422}.back .hz{color:#fff;font-size:clamp(26px,9vw,44px)}.py{font-size:24px;opacity:.96}.ex{font-family:"Songti SC",serif;font-size:17px;line-height:1.5;opacity:.95}.exp{font-size:13px;opacity:.8}.exe{font-family:Georgia,serif;font-style:italic;font-size:13px;opacity:.85}.mean{font-family:Georgia,serif;font-size:20px;margin-top:6px}.spk{font-family:inherit;font-size:13px;padding:7px 14px;border-radius:20px;border:1.5px solid rgba(0,0,0,.14);background:rgba(255,255,255,.82);color:#3a3330;cursor:pointer;margin-top:4px}.back .spk{background:rgba(255,255,255,.22);border-color:rgba(255,255,255,.5);color:#fff}.exspk{font-size:12px;padding:5px 12px;margin-top:2px}.saudio{font-size:12px;opacity:.9;margin-top:6px}.ctr{display:flex;gap:10px}.ctr button{font-size:14px;padding:10px 18px;border:1.5px solid #ddd2c6;background:#fff;border-radius:12px;color:#3a3330}.hint{font-size:12px;color:var(--ink3)}.wm{font-size:11.5px;color:var(--ink3);letter-spacing:1px;text-align:center;padding:8px 0 2px}.doneBanner{font-size:14px;color:#2e7d4f;background:#dff3e5;border-radius:12px;padding:10px 18px;display:none}</style></head><body><div class="screen on" id="sEnter"><h1>🀄️ My Flashcards</h1><div class="sub">Enter the ID your teacher gave you</div><input id="codeInput" placeholder="e.g. KOBY-7F3A" autocapitalize="characters" autocomplete="off"><div class="err" id="err"></div><button class="big" onclick="go()">Open my flashcards →</button></div><div class="screen" id="sDecks"><h1 id="dh">Your Flashcards</h1><div class="sub" id="ds"></div><div id="deckList" style="width:100%;display:flex;flex-direction:column;gap:10px"></div><button class="link" onclick="switchCode()">Use a different ID</button></div><div class="screen" id="sPlay"><h1 id="pt" style="font-size:17px"></h1><div class="cnt" id="cnt"></div><div class="scene" onclick="fl()"><div class="inner" id="inner"><div class="face front" id="ff"></div><div class="face back" id="fb"></div></div></div><div class="ctr"><button onclick="mv(-1)">← Previous</button><button onclick="fl()">Flip</button><button onclick="mv(1)">Next →</button></div><div class="doneBanner" id="doneB">🎉 Great job! You reviewed every card.</div><div class="hint">Tap the card to flip</div><button class="link" onclick="backToDecks()">← All decks</button><div class="wm" id="wm"></div></div><script>var CFG={"u":"https://vqtgupfctfthvlimpusj.supabase.co","k":"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZxdGd1cGZjdGZ0aHZsaW1wdXNqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMzNjA3NzcsImV4cCI6MjA5ODkzNjc3N30.WPE047Ufe8zifKu5MIhcwWT3yIzOU3LtKE7m6Nw1q94"};var code="",decks=[],deck=null,i=0,flips=0,flipped={},doneSent=false;function esc(s){var d=document.createElement("div");d.textContent=s==null?"":s;return d.innerHTML}function show(id){["sEnter","sDecks","sPlay"].forEach(function(s){document.getElementById(s).classList.toggle("on",s===id)})}function api(path,opts){opts=opts||{};opts.headers=Object.assign({apikey:CFG.k,Authorization:"Bearer "+CFG.k,"Content-Type":"application/json"},opts.headers||{});return fetch(CFG.u+path,opts)}async function go(){var v=document.getElementById("codeInput").value.trim().toUpperCase();if(!v)return;document.getElementById("err").textContent="";try{var r=await api("/rest/v1/rpc/get_decks",{method:"POST",body:JSON.stringify({code:v})});if(!r.ok)throw 0;var list=await r.json();if(!Array.isArray(list))list=[];list=list.filter(function(d){return d&&Array.isArray(d.cards)&&d.cards.length>0});if(!list.length){document.getElementById("err").textContent="No flashcards found for this ID. Check with your teacher.";return}code=v;localStorage.setItem("fc-code",v);decks=list;renderDecks()}catch(e){document.getElementById("err").textContent="Connection failed. Please try again."}}function renderDecks(){var el=document.getElementById("deckList");el.innerHTML="";document.getElementById("ds").textContent=(decks[0]&&decks[0].student_name?"For "+decks[0].student_name+" · ":"")+decks.length+(decks.length>1?" decks":" deck");decks.forEach(function(d,j){var b=document.createElement("button");b.className="deckBtn";b.innerHTML="<span class=dt>"+esc(d.date)+"</span><span class=tp>"+esc(d.topic||"Lesson cards")+"</span><span class=n>"+(d.cards.length|0)+" cards</span>";b.onclick=function(){openDeck(j)};el.appendChild(b)});show("sDecks")}function openDeck(j){deck=decks[j];i=0;flips=0;flipped={};doneSent=false;document.getElementById("pt").textContent=(deck.topic?deck.topic+" · ":"")+"Flashcards";document.getElementById("wm").textContent=(deck.wm?deck.wm+" · ":"")+"Made with ❤ by your teacher";document.getElementById("doneB").style.display="none";log("opened",0);showCard();show("sPlay")}function showCard(){var c=deck.cards[i];document.getElementById("inner").classList.remove("fl");var ff=document.getElementById("ff");ff.style.background=c.light;ff.style.setProperty("--mc",c.main);ff.innerHTML=(c.em&&!c.img?"<div class=emoji>"+esc(c.em)+"</div>":"")+"<div class=hz>"+esc(c.h)+"</div>"+(c.au?"<button class=spk onclick='sp(event)'>🔊 Listen</button>":"");if(c.img){var im=document.createElement("img");im.className="fimg";im.src=c.img;ff.insertBefore(im,ff.firstChild)}var fb=document.getElementById("fb");fb.style.background=c.main;fb.innerHTML="<div class=py>"+esc(c.p)+"</div><div class=hz>"+esc(c.h)+"</div>"+(c.m?"<div class=mean>"+esc(c.m)+"</div>":"")+(c.au?"<button class=spk onclick='sp(event)'>🔊 Listen</button>":"")+(c.e?"<div class=ex>"+esc(c.e)+"</div><div class=exp>"+esc(c.ep)+"</div>":"")+(c.ee?"<div class=exe>"+esc(c.ee)+"</div>":"")+(c.ea?"<button class='spk exspk' onclick='spe(event)'>🔊 例句</button>":"");document.getElementById("cnt").textContent=(i+1)+" / "+deck.cards.length}var au=null;function pl(u){if(!u)return;try{if(au)au.pause()}catch(_){}au=new Audio(u);au.play().catch(function(){})}function sp(e){if(e){e.stopPropagation()}pl(deck.cards[i].au)}function spe(e){if(e){e.stopPropagation()}pl(deck.cards[i].ea)}function fl(){var inner=document.getElementById("inner");inner.classList.toggle("fl");if(inner.classList.contains("fl")){flips++;flipped[i]=1;var cc=deck.cards[i];pl(cc.ea||cc.au);if(!doneSent&&Object.keys(flipped).length===deck.cards.length){doneSent=true;log("completed",flips);document.getElementById("doneB").style.display="block"}}}function mv(n){i=(i+n+deck.cards.length)%deck.cards.length;showCard()}function backToDecks(){show("sDecks")}function switchCode(){localStorage.removeItem("fc-code");document.getElementById("codeInput").value="";show("sEnter")}function log(ev,fl2){try{api("/rest/v1/rpc/log_practice",{method:"POST",body:JSON.stringify({code:code,deck:deck.id,ev:ev,fl:fl2||0}),keepalive:true}).catch(function(){})}catch(e){}}document.getElementById("codeInput").addEventListener("keydown",function(e){if(e.key==="Enter")go()});document.addEventListener("keydown",function(e){if(!document.getElementById("sPlay").classList.contains("on"))return;if(e.key==="ArrowLeft")mv(-1);else if(e.key==="ArrowRight")mv(1);else if(e.key===" "){e.preventDefault();fl()}});(function(){var q=new URLSearchParams(location.search).get("id")||localStorage.getItem("fc-code")||"";if(q){document.getElementById("codeInput").value=q;go()}})();</script></body></html>
