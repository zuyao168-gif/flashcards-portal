<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>桃李 Taoli · 中文老师的教学助手</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#f6f2ec; --panel:#fff; --ink:#332c29; --ink2:#6b615a; --ink3:#8d827a;
  --line:#eee5db; --accent:#d94436; --accent-soft:#fbe3dd; --accent-deep:#b3402f;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#1c1917; --panel:#26221f; --ink:#f0e9e3; --ink2:#b6aaa1; --ink3:#8d827a;
  --line:#3a332e; --accent:#f0705f; --accent-soft:#452420; --accent-deep:#ff8a78;}}
html,body{height:100%}
body{font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg); color:var(--ink); line-height:1.6;
  display:flex; align-items:center; justify-content:center; padding:24px;}
.wrap{width:min(980px,100%); display:grid; grid-template-columns:1.1fr .9fr; gap:44px; align-items:center;}
@media (max-width:820px){.wrap{grid-template-columns:1fr; gap:30px; max-width:420px}}

.mark{display:flex; align-items:baseline; gap:11px; margin-bottom:6px;}
.mark .zh{font-family:"Songti SC","STSong","Noto Serif SC",serif; font-size:44px; font-weight:700; letter-spacing:.1em;}
.mark .en{font-size:15px; color:var(--ink3); letter-spacing:.22em; text-transform:uppercase;}
.tag{font-family:"Songti SC","STSong",serif; font-size:17px; color:var(--accent-deep); letter-spacing:.18em; margin-bottom:20px;}
.lead{font-size:14.5px; color:var(--ink2); max-width:420px; margin-bottom:24px;}
.feats{display:flex; flex-direction:column; gap:13px; max-width:430px;}
.feat{display:flex; gap:11px; align-items:flex-start;}
.feat .ic{width:30px; height:30px; border-radius:9px; background:var(--accent-soft);
  display:flex; align-items:center; justify-content:center; font-size:15px; flex:none;}
.feat b{display:block; font-size:13.5px; font-weight:600;}
.feat span{font-size:12.5px; color:var(--ink3);}

.card{background:var(--panel); border:1px solid var(--line); border-radius:20px; padding:30px 28px;
  box-shadow:0 12px 34px rgba(80,60,40,.10);}
.card h2{font-size:16px; margin-bottom:3px;}
.card .sub{font-size:12.5px; color:var(--ink3); margin-bottom:20px;}
label{display:block; font-size:12px; color:var(--ink2); font-weight:600; margin:0 0 5px;}
input{width:100%; font-family:inherit; font-size:14px; padding:11px 13px; border:1.5px solid var(--line);
  border-radius:11px; background:var(--panel); color:var(--ink); margin-bottom:14px;}
input:focus{outline:none; border-color:var(--accent);}
button{width:100%; font-family:inherit; font-size:14.5px; font-weight:600; padding:12px; border:none;
  border-radius:12px; background:var(--accent); color:#fff; cursor:pointer;}
button:hover{filter:brightness(1.08)}
button:disabled{opacity:.6; cursor:default}
.msg{font-size:12.5px; margin-top:13px; line-height:1.65; min-height:18px;}
.msg.bad{color:var(--accent-deep)}
.msg.ok{color:var(--ink2)}
.foot{margin-top:20px; padding-top:16px; border-top:1px solid var(--line); font-size:11.5px; color:var(--ink3); line-height:1.7;}
</style></head><body>
<div class="wrap">
  <div>
    <div class="mark"><span class="zh">桃李</span><span class="en">Taoli</span></div>
    <div class="tag">桃 李 满 天 下</div>
    <p class="lead">给中文老师的教学助手。课后两分钟做一组闪卡推给学生，学生档案、排课收入、续费提醒都在一处。</p>
    <div class="feats">
      <div class="feat"><div class="ic">🀄️</div><div><b>课后闪卡</b><span>输入词语，拼音、英文、配图自动生成，一键推送到学生手机</span></div></div>
      <div class="feat"><div class="ic">📖</div><div><b>教学进度</b><span>点开学生就看到：上节课讲了什么、下节课要注意什么</span></div></div>
      <div class="feat"><div class="ic">📊</div><div><b>排课与收入</b><span>月历排课、单价档位、月度目标，续费到期自动提醒</span></div></div>
      <div class="feat"><div class="ic">🌍</div><div><b>学生世界地图</b><span>一键导出高清图，桃李满天下看得见</span></div></div>
    </div>
  </div>

  <div class="card">
    <h2>老师登录</h2>
    <div class="sub">仅限已开通的老师账号</div>
    <form id="f">
      <label for="em">邮箱</label>
      <input id="em" type="email" autocomplete="username" placeholder="you@example.com" required>
      <label for="pw">密码</label>
      <input id="pw" type="password" autocomplete="current-password" placeholder="••••••••" required>
      <button id="go" type="submit">进入工作台</button>
    </form>
    <div class="msg" id="msg"></div>
    <div class="foot">还没有账号？请联系为你开通的老师。<br>登录状态保存在本机浏览器，换电脑需重新登录。</div>
  </div>
</div>

<script>
var SB  = "https://vqtgupfctfthvlimpusj.supabase.co";
var KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZxdGd1cGZjdGZ0aHZsaW1wdXNqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMzNjA3NzcsImV4cCI6MjA5ODkzNjc3N30.WPE047Ufe8zifKu5MIhcwWT3yIzOU3LtKE7m6Nw1q94";
var APP = "app.html";

function msg(t, bad){ var m=document.getElementById("msg"); m.textContent=t||""; m.className="msg"+(bad?" bad":" ok"); }

// 已登录过就直接放行，别每次都拦一道
(function(){
  try{
    var a = JSON.parse(localStorage.getItem("fc-auth")||"null");
    if(a && a.refresh_token) location.replace(APP);
  }catch(e){}
})();

document.getElementById("f").addEventListener("submit", function(e){
  e.preventDefault();
  var em = document.getElementById("em").value.trim();
  var pw = document.getElementById("pw").value;
  if(!em || !pw) return;
  var btn = document.getElementById("go");
  btn.disabled = true; btn.textContent = "登录中…"; msg("");
  fetch(SB + "/auth/v1/token?grant_type=password", {
    method:"POST",
    headers:{ "apikey":KEY, "Content-Type":"application/json" },
    body: JSON.stringify({ email:em, password:pw })
  }).then(function(r){ return r.json().then(function(j){ return {ok:r.ok, j:j}; }); })
  .then(function(res){
    if(!res.ok || !res.j.access_token){
      var m = res.j.msg || res.j.error_description || res.j.message || "登录失败";
      if(/invalid/i.test(m)) m = "邮箱或密码不对";
      throw new Error(m);
    }
    // 写成老师端认得的格式；同源，跳进去就是已登录
    localStorage.setItem("fc-auth", JSON.stringify({
      access_token: res.j.access_token,
      refresh_token: res.j.refresh_token,
      exp: Date.now() + (res.j.expires_in || 3600) * 1000,
      email: (res.j.user && res.j.user.email) || em
    }));
    msg("登录成功，正在进入…");
    location.replace(APP);
  })
  .catch(function(err){
    btn.disabled = false; btn.textContent = "进入工作台";
    msg(err.message || "登录失败，检查网络后重试", true);
  });
});
</script>
</body></html>
